services:
  todo:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:${HOST_PORT:-3080}:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - todo
    profiles:
      - tunnel
